name: Foundation build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev xvfb
      - run: cmake --preset linux-debug
      - run: cmake --build --preset linux-debug
      - run: ctest --preset linux-debug
      - name: GUI self-test without audio devices
        run: |
          xvfb-run -a build/linux-debug/foundation_gui
          xvfb-run -a build/linux-debug/bin/UndertowFoundation selftest
          xvfb-run -a build/linux-debug/preview_gui
          xvfb-run -a build/linux-debug/preview_gui --small
          xvfb-run -a build/linux-debug/preview_gui --standalone
          xvfb-run -a build/linux-debug/maelstrom_mockup
          xvfb-run -a build/linux-debug/maelstrom_mockup --small
          xvfb-run -a build/linux-debug/whitecap_gui
          xvfb-run -a build/linux-debug/whitecap_gui --small
          xvfb-run -a build/linux-debug/squall_mockup
          xvfb-run -a build/linux-debug/squall_mockup --small
          xvfb-run -a build/linux-debug/bin/UndertowPreview selftest
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-foundation-linux-debug
          path: |
            build/linux-debug/bin/UndertowFoundation
            build/linux-debug/bin/UndertowFoundation.vst3/
            build/linux-debug/bin/UndertowPreview
            build/linux-debug/bin/UndertowPreview.vst3/
            build/linux-debug/bin/notices/
            LICENSE
            THIRD_PARTY_NOTICES.md
            docs/building.md
            docs/preview.md
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake --preset windows-debug
      - run: cmake --build --preset windows-debug
      - run: ctest --preset windows-debug
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-foundation-windows-debug
          path: |
            build/windows-debug/bin/UndertowFoundation.exe
            build/windows-debug/bin/UndertowFoundation.vst3/
            build/windows-debug/bin/UndertowPreview.exe
            build/windows-debug/bin/UndertowPreview.vst3/
            build/windows-debug/bin/notices/
            LICENSE
            THIRD_PARTY_NOTICES.md
            docs/building.md
            docs/preview.md
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev
      - run: cmake --preset linux-sanitized
      - run: cmake --build --preset linux-sanitized --target foundation_tests dark_delay_tests preview_tests tempo_sync_tests dark_reverb_tests au_tempo_bridge_tests maelstrom_tests maelstrom_plugin_tests whitecap_tests whitecap_plugin_tests
      - run: ctest --preset linux-sanitized
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake --preset macos-release
      - run: cmake --build --preset macos-release
      - run: ctest --preset macos-release
      - name: GUI checks without audio devices
        run: |
          build/macos-release/preview_gui
          build/macos-release/preview_gui --small
          build/macos-release/maelstrom_mockup
          build/macos-release/maelstrom_mockup --small
      - name: Package ad-hoc-signed tester plugins without installing them
        run: cmake -DBINARY_DIR="$PWD/build/macos-release" -DSOURCE_DIR="$PWD" -P cmake/PackageMacPreview.cmake
      - name: Verify archive round trip and load packaged plugins without installing them
        run: |
          ditto -x -k build/macos-release/UndertowPreview-macos-universal.zip "$RUNNER_TEMP/undertow-archive-check"
          codesign --verify --strict "$RUNNER_TEMP/undertow-archive-check/UndertowPreview/UndertowPreview.component"
          codesign --verify --strict "$RUNNER_TEMP/undertow-archive-check/UndertowPreview/UndertowPreview.vst3"
          build/macos-release/mac_au_tests "$RUNNER_TEMP/undertow-archive-check/UndertowPreview/UndertowPreview.component"
          build/macos-release/mac_vst3_tests "$RUNNER_TEMP/undertow-archive-check/UndertowPreview/UndertowPreview.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-macos-universal-tested-on-${{ matrix.runner }}
          path: |
            build/macos-release/UndertowPreview-macos-universal.zip
            build/macos-release/UndertowPreview-macos-universal.zip.sha256
          if-no-files-found: error
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev xvfb
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release
      - run: ctest --preset linux-release
      - name: Release GUI controls without audio devices
        run: xvfb-run -a build/linux-release/preview_gui
      - name: Package plugins without installing them
        run: cmake -DBINARY_DIR="$PWD/build/linux-release" -DSOURCE_DIR="$PWD" -P cmake/PackagePreview.cmake
      - name: Inspect and load the extracted Release plugin
        run: |
          python tools/verify_preview_package.py build/linux-release/UndertowPreview-linux-x86_64.zip --commit "$GITHUB_SHA"
          python -m zipfile -e build/linux-release/UndertowPreview-linux-x86_64.zip "$RUNNER_TEMP/undertow-linux-roundtrip"
          build/linux-release/vst3_loader_tests "$RUNNER_TEMP/undertow-linux-roundtrip/UndertowPreview/UndertowPreview.vst3/Contents/x86_64-linux/UndertowPreview.so" "Undertow Preview" 0.4.0
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-preview-linux-x86_64
          path: |
            build/linux-release/UndertowPreview-linux-x86_64.zip
            build/linux-release/UndertowPreview-linux-x86_64.zip.sha256
          if-no-files-found: error
  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake --preset windows-release
      - run: cmake --build --preset windows-release
      - run: ctest --preset windows-release
      - name: Package plugins without installing them
        run: cmake "-DBINARY_DIR=$pwd/build/windows-release" "-DSOURCE_DIR=$pwd" -DCONFIG=Release -P cmake/PackagePreview.cmake
      - name: Inspect imports and load the extracted Release plugin
        run: |
          python tools/verify_preview_package.py build/windows-release/UndertowPreview-windows-x86_64.zip --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m zipfile -e build/windows-release/UndertowPreview-windows-x86_64.zip "$env:RUNNER_TEMP/undertow-windows-roundtrip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-release/Release/vst3_loader_tests.exe "$env:RUNNER_TEMP/undertow-windows-roundtrip/UndertowPreview/UndertowPreview.vst3/Contents/x86_64-win/UndertowPreview.vst3" "Undertow Preview" 0.4.0
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-preview-windows-x86_64
          path: |
            build/windows-release/UndertowPreview-windows-x86_64.zip
            build/windows-release/UndertowPreview-windows-x86_64.zip.sha256
          if-no-files-found: error
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_preview_packages.py' -v
      - run: python tools/package_preview_source.py --output "$RUNNER_TEMP/undertow-source"
      - name: Check source archive reproducibility
        run: |
          python tools/package_preview_source.py --output "$RUNNER_TEMP/undertow-source-repeat"
          cmp "$RUNNER_TEMP/undertow-source/"*.tar.gz "$RUNNER_TEMP/undertow-source-repeat/"*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-preview-source
          path: ${{ runner.temp }}/undertow-source/
          if-no-files-found: error
  preview-candidate:
    needs: [linux, windows, sanitizers, macos, linux-release, windows-release, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: undertow-preview-linux-x86_64
          path: incoming/
      - uses: actions/download-artifact@v4
        with:
          name: undertow-preview-windows-x86_64
          path: incoming/
      - uses: actions/download-artifact@v4
        with:
          name: undertow-macos-universal-tested-on-macos-15
          path: incoming/
      - uses: actions/download-artifact@v4
        with:
          name: undertow-preview-source
          path: incoming/
      - name: Verify common source identity and assemble review-only assets
        run: python tools/assemble_preview_assets.py --input incoming --output candidate --commit "$GITHUB_SHA"
      - name: Include the draft release notes
        run: cp release/NOTES.md candidate/RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: undertow-preview-release-candidate
          path: candidate/
          if-no-files-found: error
